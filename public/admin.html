<!doctype html>
<html lang="en">
  <head>
    <title>Admin — Lay C Factory</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="styles.css?v=admin6" />
    <style>
      :root {
        --admin-side: min(260px, 86vw);
        --navy: #0f2a8a;
        --blue: #4169e1;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(160deg, #f7f9ff 0%, #eef2ff 45%, #ffffff 100%);
        color: var(--fg);
        font:
          14px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #gate,
      #app {
        height: 100%;
      }
      #gate {
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }
      /* ID display rules beat the UA [hidden] stylesheet — force hide explicitly. */
      #gate[hidden],
      #app[hidden] {
        display: none !important;
      }
      .login-card {
        width: min(420px, 100%);
        padding: 28px 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 50px rgba(15, 42, 138, 0.12);
      }
      .login-card h1 {
        margin: 0 0 6px;
        font-size: clamp(22px, 4vw, 28px);
      }
      .login-card p {
        margin: 0 0 18px;
        color: var(--mut);
      }
      .login-card label {
        display: block;
        margin: 0 0 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .login-card input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
      }
      .login-card button,
      .btn {
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--amber);
        color: var(--on);
        font-weight: 600;
        cursor: pointer;
      }
      .btn.ghost {
        background: #fff;
        color: var(--fg);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: #fff;
        color: #b42318;
        border: 1px solid #b42318;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .note {
        min-height: 1.2em;
        margin-top: 10px;
        font-weight: 600;
        color: #b42318;
      }
      #app {
        display: grid;
        grid-template-columns: var(--admin-side) 1fr;
      }
      .nav {
        overflow: auto;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.88);
        padding: max(14px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 14px;
      }
      .brand b {
        font-size: 15px;
      }
      .nav button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0 0 6px;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      .nav button.on {
        background: rgba(65, 105, 225, 0.12);
        border-color: var(--line);
        font-weight: 600;
      }
      .who {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--mut);
        word-break: break-all;
      }
      .main {
        overflow: auto;
        padding: max(16px, env(safe-area-inset-top)) clamp(12px, 2vw, 22px) max(24px, env(safe-area-inset-bottom));
      }
      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .topbar h2 {
        margin: 0;
        font-size: clamp(20px, 3vw, 26px);
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 14px;
      }
      .tools input,
      .tools select {
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
        background: #fff;
        min-width: min(180px, 100%);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.9);
        min-width: 0;
      }
      .cards > .card > b,
      .stat b {
        display: block;
        font-size: clamp(18px, 4vw, 22px);
        line-height: 1.2;
        word-break: break-word;
      }
      .cards > .card > span,
      .stat span {
        color: var(--mut);
        font-size: 12px;
      }
      .profile-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
        gap: 12px;
        margin-top: 14px;
      }
      .profile-field {
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .profile-field .label {
        display: block;
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mut);
      }
      .profile-field .value {
        display: block;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        line-height: 1.35;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .table-wrap {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 12px;
      }
      table {
        width: 100%;
        min-width: 560px;
        border-collapse: collapse;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: rgba(65, 105, 225, 0.08);
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--mut);
      }
      td small {
        display: block;
        color: var(--mut);
      }
      .pager {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      .empty {
        color: var(--mut);
        padding: 18px 0;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 11px;
        font-weight: 600;
      }
      .pill.on {
        background: rgba(22, 163, 74, 0.12);
        color: #15803d;
      }
      .pill.off {
        background: rgba(180, 35, 24, 0.08);
        color: #b42318;
      }
      .detail {
        margin-top: 14px;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 320px;
      }
      .actions .btn {
        font-size: 12px;
        padding: 7px 10px;
      }
      .order-doc {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
        padding: clamp(16px, 3vw, 28px);
        box-shadow: 0 12px 36px rgba(15, 42, 138, 0.08);
      }
      .order-doc .doc-brand {
        color: var(--navy);
        font-size: clamp(20px, 3vw, 26px);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .order-doc .doc-sub {
        color: var(--blue);
        margin: 2px 0 14px;
        font-weight: 600;
      }
      .order-doc h3 {
        margin: 18px 0 8px;
        color: var(--navy);
        font-size: 14px;
        border-bottom: 1px solid #d8e0f8;
        padding-bottom: 6px;
      }
      .order-doc .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 8px 14px;
        margin-bottom: 8px;
      }
      .order-doc .meta div span {
        display: block;
        font-size: 11px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .order-doc .meta div b {
        font-size: 13px;
        font-weight: 600;
      }
      .order-doc table.sheet {
        font-size: 12px;
      }
      .order-doc .grand {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 800;
        color: var(--navy);
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 12px;
      }
      .filters button {
        padding: 7px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .filters button.on {
        background: rgba(65, 105, 225, 0.14);
        border-color: var(--blue);
        color: var(--navy);
        font-weight: 600;
      }
      .timeline {
        display: grid;
        gap: 8px;
      }
      .tl-item {
        display: grid;
        grid-template-columns: minmax(64px, 72px) minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.95);
        cursor: pointer;
        min-width: 0;
      }
      .tl-item:hover {
        border-color: var(--blue);
      }
      .tl-item .kind {
        font-size: 11px;
        font-weight: 700;
        color: var(--navy);
        text-transform: uppercase;
      }
      .tl-item b,
      .tl-item small {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .code-box {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px dashed var(--blue);
        border-radius: 12px;
        background: rgba(65, 105, 225, 0.06);
      }
      .code-box code {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--navy);
        overflow-wrap: anywhere;
      }
      .picker {
        display: grid;
        gap: 8px;
      }
      .picker-list {
        max-height: min(40vh, 280px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .picker-list button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
        font: inherit;
      }
      .picker-list button:hover,
      .picker-list button.on {
        background: rgba(65, 105, 225, 0.1);
      }
      .picker-list button small {
        display: block;
        color: var(--mut);
      }
      @media (max-width: 640px) {
        .tl-item {
          grid-template-columns: 1fr;
        }
        .actions {
          max-width: none;
        }
        table {
          min-width: 480px;
        }
      }
      .modal-back {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(15, 42, 138, 0.28);
        display: grid;
        place-items: start center;
        padding: 24px 12px;
        overflow: auto;
      }
      .modal-back .order-doc {
        width: min(920px, 100%);
        margin: 0;
      }
      .thumb {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .form-grid label {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .form-grid input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
      }
      .menu-toggle {
        display: none;
      }
      @media (max-width: 860px) {
        #app.on {
          grid-template-columns: 1fr;
        }
        .nav {
          position: fixed;
          z-index: 40;
          inset: 0 auto 0 0;
          width: var(--admin-side);
          transform: translateX(-105%);
          transition: transform 0.2s ease;
          box-shadow: 12px 0 40px rgba(15, 42, 138, 0.16);
        }
        .nav.open {
          transform: none;
        }
        .menu-toggle {
          display: inline-flex;
        }
      }
      .trk {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #e6ebf7;
      }
      .trk i {
        flex: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #c5d0ea;
        display: grid;
        place-items: center;
        font: 700 11px system-ui;
        font-style: normal;
        color: #6b7aa3;
      }
      .trk.d i {
        background: #4169e1;
        border-color: #4169e1;
        color: #fff;
      }
      .trk.n i {
        border-color: #4169e1;
        color: #4169e1;
        box-shadow: 0 0 0 4px rgba(65, 105, 225, 0.18);
      }
      .trk .meta {
        color: #5c6b94;
        font-size: 12px;
      }
      .trk.g i {
        border-color: #d4af37;
        color: #b8860b;
      }
      .trk.g b {
        color: #8a6a12;
      }
      .trk.g.d i {
        background: #d4af37;
        border-color: #d4af37;
        color: #fff;
      }
      .trk.g.n i {
        border-color: #d4af37;
        color: #b8860b;
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.28);
      }
    </style>
  </head>
  <body>
    <div id="gate">
      <form class="login-card" id="login" action="#" method="post">
        <h1>Lay C Admin</h1>
        <p>Sign in with an authorized admin account. There is no public registration for this panel.</p>
        <label>Email<input id="email" type="email" autocomplete="username" required /></label>
        <label>Password<input id="pass" type="password" autocomplete="current-password" minlength="6" required /></label>
        <button type="submit" id="loginBtn">Sign in</button>
        <p class="note" id="gateNote"></p>
      </form>
    </div>

    <div id="app" hidden>
      <aside class="nav" id="nav">
        <div class="brand">
          <b>Lay C Admin</b>
          <button type="button" class="btn ghost" id="navClose" hidden>Close</button>
        </div>
        <nav id="sections">
          <button type="button" data-sec="overview" class="on">Overview</button>
          <button type="button" data-sec="orders">Orders</button>
          <button type="button" data-sec="tracking">Order Tracking Management</button>
          <button type="button" data-sec="customers">Customers</button>
          <button type="button" data-sec="meetings">Meeting rooms</button>
          <button type="button" data-sec="reviews">Reviews</button>
          <button type="button" data-sec="rooms">Order sheets</button>
          <button type="button" data-sec="logs">Activity logs</button>
          <button type="button" data-sec="settings">Admin settings</button>
        </nav>
        <div class="who">
          <div id="who">Signed in</div>
          <button type="button" class="btn ghost" id="logout" style="margin-top: 10px; width: 100%">Log out</button>
          <a class="btn ghost" href="/" style="display: block; margin-top: 8px; text-align: center; text-decoration: none">Open website</a>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div style="display: flex; gap: 8px; align-items: center">
            <button type="button" class="btn ghost menu-toggle" id="menuOpen">Menu</button>
            <h2 id="title">Overview</h2>
          </div>
          <span id="statusLine" class="pill">Ready</span>
        </div>
        <div id="panel"></div>
      </main>
    </div>

    <script>
      const $ = (s, r) => (r || document).querySelector(s);
      const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
      // Prefer scoped queries when a root element is passed.
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const ADMIN_KEY = "lcadmin";
      const titles = {
        overview: "Overview",
        orders: "Orders",
        tracking: "Order Tracking Management",
        customers: "Customers",
        meetings: "Meeting rooms",
        albums: "Family photo album",
        reviews: "Reviews",
        rooms: "Order room sheets",
        logs: "Reports and activity logs",
        settings: "Admin settings",
      };
      let token = "";
      let email = "";
      let sec = "overview";
      let page = 1;
      let q = "";
      let selected = null;
      let customerEmail = "";
      let activityFilter = "all";
      const SIZES = ["XS", "S", "M", "L", "XL", "XXL", "3XL"];
      const iconUser =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.5-3.2 4-4.8 7-4.8s5.5 1.6 7 4.8"/></svg>';

      function note(el, t) {
        const n = $(el);
        if (n) n.textContent = t || "";
      }
      function setStatus(t) {
        $("#statusLine").textContent = t || "Ready";
      }
      function saveSession(data) {
        localStorage.setItem(
          ADMIN_KEY,
          JSON.stringify({
            email: data.email || email,
            name: data.name || "",
            token: data.token || token,
          }),
        );
      }
      function clearSession() {
        localStorage.removeItem(ADMIN_KEY);
        token = "";
        email = "";
      }
      async function call(body) {
        const res = await fetch("/api/admin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({ token }, body)),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          const err = new Error(data.error || "The admin request failed.");
          err.status = res.status;
          throw err;
        }
        return data;
      }
      function when(v) {
        if (!v) return "—";
        const d = new Date(v);
        return isNaN(d) ? String(v) : d.toLocaleString();
      }
      function pager(data) {
        if (!data || !data.pages) return "";
        return (
          '<div class="pager"><button type="button" class="btn ghost" data-page="' +
          Math.max(1, (data.page || 1) - 1) +
          '" ' +
          (data.page <= 1 ? "disabled" : "") +
          ">Prev</button><span>Page " +
          esc(data.page) +
          " / " +
          esc(data.pages) +
          " · " +
          esc(data.total) +
          ' rows</span><button type="button" class="btn ghost" data-page="' +
          Math.min(data.pages, (data.page || 1) + 1) +
          '" ' +
          (data.page >= data.pages ? "disabled" : "") +
          ">Next</button></div>"
        );
      }
      function tools(extra) {
        return (
          '<div class="tools"><input id="q" placeholder="Search" value="' +
          esc(q) +
          '" /><button type="button" class="btn" id="find">Search</button>' +
          (extra || "") +
          "</div>"
        );
      }
      function bindTools(reload) {
        $("#find")?.addEventListener("click", () => {
          q = $("#q").value.trim();
          page = 1;
          reload();
        });
        $("#q")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            q = $("#q").value.trim();
            page = 1;
            reload();
          }
        });
        $$("[data-page]").forEach((b) =>
          b.addEventListener("click", () => {
            page = Number(b.dataset.page) || 1;
            reload();
          }),
        );
      }
      function downloadCsv(filename, csv) {
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename || "lay-c-export.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function downloadBase64(filename, b64, mime) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: mime || "application/octet-stream" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename || "download.bin";
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function np(v) {
        return v == null || v === "" ? "Not provided" : String(v);
      }
      async function exportOrderExcel(id) {
        const file = await call({ op: "order_excel", id });
        if (file.url) {
          window.open(file.url, "_blank", "noopener");
        } else if (file.csv) {
          downloadCsv(file.filename, file.csv);
        } else {
          throw new Error("No Excel export available for this order.");
        }
        setStatus("Excel ready · " + (file.source || "order"));
      }
      async function downloadOrderPdf(id) {
        const file = await call({ op: "order_pdf", id });
        if (!file.pdf_base64) throw new Error("PDF was not generated.");

      function copyText(value) {
        const t = String(value || "");
        if (!t) return Promise.reject(new Error("Nothing to copy"));
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
        const ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        return Promise.resolve();
      }

      function paintTrackOrder(order) {
        const stages = Array.isArray(order.stages) ? order.stages : [];
        const stage = Number.isInteger(order.stage) ? order.stage : 0;
        const rows = stages
          .map((name, i) => {
            const done = !!order.complete || i < stage;
            const active = !order.complete && i === stage;
            const status = done ? "Completed" : active ? "In Progress" : "Pending";
            const gold = i === 6 && name === "Deployment & Launch";
            const cls = (done ? "trk d" : active ? "trk n" : "trk") + (gold ? " g" : "");
            return (
              '<div class="' +
              cls +
              '"><i>' +
              (done ? "✓" : i + 1) +
              "</i><div><b>" +
              esc(name) +
              '</b><div class="meta">' +
              status +
              "</div></div></div>"
            );
          })
          .join("");
        $("#panel").innerHTML =
          '<p><button type="button" class="btn ghost" id="trackBack">Back to orders</button></p>' +
          '<div class="card"><p><b>' +
          esc(order.title || "Order") +
          "</b><br>" +
          esc(order.name || "") +
          (order.email ? " · " + esc(order.email) : "") +
          "<br>" +
          esc(order.id) +
          " · " +
          esc(when(order.created_at)) +
          "</p><p>Current stage: <b>" +
          esc(order.current || "") +
          "</b> · Progress " +
          esc(order.progress || 0) +
          "%</p>" +
          rows +
          (order.complete
            ? '<p>This order is complete.</p>'
            : '<p><button type="button" class="btn" id="markStage">Mark as Complete</button></p>') +
          '<p id="trackNote"></p></div>';
        $("#trackBack").onclick = () => {
          showTracking().then(() => setStatus("Ready")).catch((err) => {
            $("#panel").innerHTML = '<p class="empty">' + esc(err.message || "Could not load this section.") + "</p>";
            setStatus("Error");
          });
        };
        const mark = $("#markStage");
        if (!mark) return;
        mark.onclick = async () => {
          mark.disabled = true;
          note("#trackNote", "Saving…");
          try {
            const saved = await call({ op: "order_tracking_advance", id: order.id, stage });
            if (!saved.order) throw new Error("The stage was not saved.");
            note("#trackNote", "");
            setStatus("Stage saved.");
            paintTrackOrder(saved.order);
          } catch (err) {
            mark.disabled = false;
            note("#trackNote", err.message || "The stage was not saved.");
            setStatus("Error");
          }
        };
      }

      async function go(next) {
        sec = next || sec;
        page = sec === next ? page : 1;
        if (arguments.length && next) page = 1;
        $("#title").textContent = titles[sec] || sec;
        $$("#sections button").forEach((b) => b.classList.toggle("on", b.dataset.sec === sec));
        $("#nav").classList.remove("open");
        setStatus("Loading…");
        try {
          await screens[sec]();
          setStatus("Ready");
          armLiveRefresh();
        } catch (err) {
          if (err.status === 403) {
            logout(err.message);
            return;
          }
          $("#panel").innerHTML = '<p class="empty">' + esc(err.message || "Could not load this section.") + "</p>";
          setStatus("Error");
        }
      }

      function enterApp(session) {
        token = session.token;
        email = session.email || "";
        const gate = $("#gate");
        const app = $("#app");
        gate.hidden = true;
        gate.setAttribute("hidden", "");
        app.hidden = false;
        app.removeAttribute("hidden");
        $("#who").textContent = "Signed in as " + email;
        go("overview");
      }

      function logout(msg) {
        clearSession();
        const gate = $("#gate");
        const app = $("#app");
        app.hidden = true;
        app.setAttribute("hidden", "");
        gate.hidden = false;
        gate.removeAttribute("hidden");
        note("#gateNote", msg || "");
      }

      $("#login").addEventListener("submit", async (e) => {
        e.preventDefault();
        note("#gateNote", "");
        const btn = $("#login button");
        btn.disabled = true;
        try {
          const res = await fetch("/api/account", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode: "login",
              customer_email: $("#email").value.trim(),
              password: $("#pass").value,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw new Error(data.error || "Log in failed.");
          if (!data.staff) throw new Error("This account is not authorized for admin access.");
          token = data.token;
          email = data.customer_email || "";
          saveSession({ token, email, name: data.customer_name || "" });
          // Confirm server-side admin gate before showing dashboard.
          await call({ op: "session" });
          $("#pass").value = "";
          enterApp({ token, email });
        } catch (err) {
          clearSession();
          note("#gateNote", err.message || "Log in failed.");
        } finally {
          btn.disabled = false;
        }
      });

      $("#sections").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-sec]");
        if (b) go(b.dataset.sec);
      });
      $("#logout").onclick = () => logout("Signed out.");
      $("#menuOpen").onclick = () => $("#nav").classList.add("open");
      $("#navClose").onclick = () => $("#nav").classList.remove("open");
      $("#navClose").hidden = false;

      (async () => {
        const saved = JSON.parse(localStorage.getItem(ADMIN_KEY) || "null");
        if (!saved || !saved.token) return;
        token = saved.token;
        email = saved.email || "";
        try {
          await call({ op: "session" });
          enterApp(saved);
        } catch (err) {
          logout(err.message || "Sign in again with an admin account.");
        }
      })();
    </script>
  </body>
</html>
